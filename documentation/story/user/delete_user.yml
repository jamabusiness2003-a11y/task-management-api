version : "0.1"

user_stories:

  title: Delete a user
  label: [users, delete, user_story]
  end_user:
    actor: "Registered user or administrator"
    story: >
      As an authorized user, I need to delete a user account
      so that an account that is no longer needed can be removed.
  system_user:
    actors: [Admin Application, User Website]
    story: >
      As the Admin Application or User Website, I need to remove the selected user from the database
      so that the account is no longer available.
      
  acceptance_criteria:

    id: SC001
    scenario: Delete an existing user
    given:
      - The user corresponding to the requested ID exists.
      - The application has a valid token.
      - The requester is authorized to delete this user.
    when:
      - The application requests deletion of the user.
    then:
      - The API deletes the user from the database.
      - The API confirms that the deletion succeeded.

    id: SC002
    scenario: Delete a non-existent user
    given:
      - The user corresponding to the requested ID does not exist.
      - The application has a valid token.
    when:
      - The application requests deletion of the user.
    then:
      - The API indicates that the requested user was not found.

    id: SC003
    scenario: Delete a user without a valid token
    given:
      - The user exists.
      - The application does not have a valid token.
    when:
      - The application requests deletion of the user.
    then:
      - The API returns HTTP status 401.
      - The API denies access to the client.
